name: Update CelesTrak catalog
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download TLE catalog
        run: |
          mkdir -p data
          # ✅ FORMAT TLE BRUT au lieu de JSON
          curl -sL "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle" -o data/all_active.tle
          # ✅ Convertir TLE → JSON pour le client
          python3 -c "
import json, re
sats = []
with open('data/all_active.tle') as f:
    lines = [l.rstrip() for l in f if l.strip()]
for i in range(0, len(lines), 3):
    if i + 2 < len(lines):
        sats.append({
            'OBJECT_NAME': lines[i].strip(),
            'TLE_LINE1': lines[i+1].strip(),
            'TLE_LINE2': lines[i+2].strip(),
        })
with open('data/all_active.json', 'w') as f:
    json.dump(sats, f)
print(f'{len(sats)} satellites convertis')
"
          ls -lh data/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update TLE catalog [skip ci]"
          git push
