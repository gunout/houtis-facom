name: Update CelesTrak catalog

on:
  schedule:
    - cron: '0 */6 * * *'   # Toutes les 6 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CelesTrak catalog
        run: |
          mkdir -p data
          curl -sL "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json" -o data/all_active.json
          ls -lh data/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all_active.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update CelesTrak catalog [skip ci]"
          git push
